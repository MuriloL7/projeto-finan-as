<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitwise</title>

    <link rel="stylesheet" href="CSS/style.css">

    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="h-screen flex flex-col items-center font-serif">
        
    <!-- NAVBAR -->
    <nav class="flex items-center justify-between px-6 md:px-16 w-full lg:px-24 xl:px-32 py-4 border-b border-gray-300 bg-white relative transition-all">
    <h1 class="font-large">Splitwise</h1>
    <!-- <a href="https://prebuiltui.com"> -->
        <!--usar quando tiver logo <img class="h-9" src="https://raw.githubusercontent.com/prebuiltui/prebuiltui/main/assets/dummyLogo/dummyLogoColored.svg" alt="dummyLogoColored"> -->
    <!-- </a> -->

    <button aria-label="Menu" id="menu-toggle" class="sm:hidden">
        <svg width="21" height="15" viewBox="0 0 21 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="21" height="1.5" rx=".75" fill="#426287"/>
            <rect x="8" y="6" width="13" height="1.5" rx=".75" fill="#426287"/>
            <rect x="6" y="13" width="15" height="1.5" rx=".75" fill="#426287"/>
        </svg>
    </button>

    <div id="mobile-menu" class="hidden absolute top-[60px] left-0 w-full bg-white shadow-md py-4 flex-col items-start gap-2 px-5 text-sm md:hidden">
        <a href="#" class="block">Pessoas</a>
        <a href="gastos.html" class="block">Gastos</a>
        <button class="cursor-pointer px-6 py-2 mt-2 bg-indigo-500 hover:bg-indigo-600 transition text-white rounded-full text-sm">
            Login
        </button>
    </div>

    <div class="hidden sm:flex items-center gap-8">
        <a href="#" class="text-indigo-500">Pessoas</a>
        <a href="gastos.html">Gastos</a>

        <div class="hidden lg:flex items-center text-sm gap-2 border border-gray-300 px-3 rounded-full">
            <input class="py-1.5 w-full bg-transparent outline-none placeholder-gray-500" type="text" placeholder="" />
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.836 10.615 15 14.695" stroke="#7A7B7D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path clip-rule="evenodd" d="M9.141 11.738c2.729-1.136 4.001-4.224 2.841-6.898S7.67.921 4.942 2.057C2.211 3.193.94 6.281 2.1 8.955s4.312 3.92 7.041 2.783" stroke="#7A7B7D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>


        <button class="cursor-pointer px-8 py-2 bg-indigo-500 hover:bg-indigo-600 transition text-white rounded-full">
            Login
        </button>
    </div>
    </nav>
    <!-- NAVBAR END -->

    <div class="form flex justify-center flex-col items-center h-top p-20 absolute">
        <label for="nome" class="block text-sm font-medium text-gray-700 mb-1 text-xl"></label>
        <div class="w-full max-w-sm min-w-[400px]">
            <div class="relative">        
                <input type="text" id="nome" name="nome" class="w-full pl-3 pr-10 py-2 bg-transparent placeholder:text-slate-400 text-slate-600 text-sm border border-slate-200 rounded-md transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow" placeholder="Digite o nome da pessoa"><br>

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="absolute w-5 h-5 top-2.5 right-2.5 text-slate-600">
                    <path d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"></path>
                </svg>


        <div class="mt-4" >
            <button onclick="adicionarPessoa()" class="text-white button button-pink bg-indigo-500 hover:bg-indigo-600 px-20 h-8 rounded-md w-full" data-ripple-light="true">Adicionar pessoa</button>
        </div>
    </div>


        <div class="lista w-full block text-center">    
            <ul id="listaNomes"></ul>
        </div>

    <script>
    document.getElementById("menu-toggle").addEventListener("click", function () {
        const menu = document.getElementById("mobile-menu");
        if (menu.classList.contains("hidden")) {
            menu.classList.remove("hidden");
            menu.classList.add("flex");
        } else {
            menu.classList.add("hidden");
        }
    });
    </script>

    <script src="Script/script.js"></script>
</body>
</html>
